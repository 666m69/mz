name: Build approved MZ brand assets
on:
  pull_request:
    paths:
      - 'scripts/generate-brand-png.py'
      - 'site/assets/images/mz-mark.svg'
      - '.github/workflows/build-brand-assets.yml'
permissions:
  contents: write
jobs:
  render-brand:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render SVG icon and sharing image as PNG
        run: |
          python -m pip install --disable-pip-version-check pillow cairosvg
          python scripts/generate-brand-png.py
      - name: Commit only the generated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/images/icon-192.png site/assets/images/icon-512.png site/assets/images/mz-share.png
          if ! git diff --cached --quiet; then
            git commit -m 'brand: publish approved MZcode PNG icons and social preview'
            git push origin HEAD:"${{ github.head_ref }}"
          fi
