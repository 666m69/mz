name: Verify MZcode
on:
  pull_request:
  push:
    branches:
      - main
      - design/modern-studio-nov-02
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
