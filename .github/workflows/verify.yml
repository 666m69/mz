name: Verify MZcode
on:
  pull_request:
  push:
    branches:
      - main
      - design/modern-studio-nov-02
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch pinned public repository revision without Marketplace actions
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/666m69/mz.git repo
          git -C repo fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git -C repo checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify repository tests with preinstalled Node.js
        working-directory: repo
        run: npm test
