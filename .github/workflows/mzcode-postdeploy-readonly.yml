name: MZcode post-deploy read-only acceptance

on:
  push:
    branches:
      - qa/readonly-release-check-20261103
    paths:
      - pilot/readonly-release-check.mjs
      - .github/workflows/mzcode-postdeploy-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public release without creating requests or emails
        run: node pilot/readonly-release-check.mjs
