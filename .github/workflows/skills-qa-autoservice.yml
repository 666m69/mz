name: Skills Server isolated auto-service acceptance
on:
  push:
    branches:
      - qa/skills-autopoll-20261108

permissions:
  contents: read

concurrency:
  group: mzcode-skills-qa-autoservice
  cancel-in-progress: false

jobs:
  synthetic-autoservice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch pinned public repository revision (no Marketplace actions)
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/666m69/mz.git repo
          git -C repo fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git -C repo checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify Linux runner isolation prerequisites
        working-directory: repo
        run: |
          node --version
          python3 --version
          python3 -c "import ctypes; ctypes.CDLL('libseccomp.so.2')"
          python3 -B skills-server/test/isolation.py
      - name: Test controlled service lifecycle
        working-directory: repo
        run: python3 -B -m unittest discover -s skills-server/test -p test_service.py -v
      - name: Exercise autonomous synthetic jobs without secrets or hosted services
        working-directory: repo
        run: node --test skills-server/test/auto-service.test.mjs
      - name: Verify quotas, access boundaries and stale leases
        working-directory: repo
        run: node --test skills-server/test/control.test.mjs
