name: MZ share invitation live acceptance
on:
  push:
    branches: [feature/invite-casual-browse-20261103]
    paths:
      - pilot/invite-release-readonly.mjs
      - .github/workflows/mz-share-invitation-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only public invite and links smoke
        run: node pilot/invite-release-readonly.mjs
