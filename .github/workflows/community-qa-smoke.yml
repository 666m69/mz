name: Community QA smoke (isolated route)
on:
  pull_request:
    paths:
      - 'pilot/community/**'
      - '.github/workflows/community-qa-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise live QA route without paid dependencies
        run: node pilot/community/qa-smoke.mjs --write
