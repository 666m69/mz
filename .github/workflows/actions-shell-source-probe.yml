name: MZcode Actions shell-source probe
on:
  push:
    branches:
      - qa/skills-autopoll-20261108

permissions:
  contents: read

jobs:
  shell_clone_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public source without marketplace actions
        run: |
          git clone --quiet --depth 1 --branch qa/skills-autopoll-20261108 https://github.com/666m69/mz.git repo
          test -f repo/skills-server/runner/agent.py
          echo "Node installed: $(node --version)"
          echo "Python installed: $(python3 --version)"
          ls -la /opt/hostedtoolcache/node || true
