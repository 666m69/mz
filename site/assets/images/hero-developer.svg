<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="300" cy="250" r="220" fill="url(#glow)"/>

  <!-- Main Tech Window -->
  <rect x="70" y="60" width="460" height="340" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="70" y="60" width="460" height="40" rx="16" fill="#0f172a"/>
  <circle cx="100" cy="80" r="6" fill="#ef4444"/>
  <circle cx="120" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="140" cy="80" r="6" fill="#10b981"/>
  <rect x="170" y="70" width="220" height="20" rx="6" fill="#1e293b"/>
  <text x="185" y="84" fill="#94a3b8" font-family="monospace" font-size="11">mz702.developer.build()</text>

  <!-- Code and Architecture Visualization inside -->
  <text x="100" y="130" fill="#38bdf8" font-family="monospace" font-size="13">const <tspan fill="#f8fafc">growthEngine</tspan> = {</text>
  <text x="125" y="155" fill="#94a3b8" font-family="monospace" font-size="12">speed: <tspan fill="#10b981">"0.6s Ultra Fast"</tspan>,</text>
  <text x="125" y="180" fill="#94a3b8" font-family="monospace" font-size="12">conversionRate: <tspan fill="#f59e0b">"+180%"</tspan>,</text>
  <text x="125" y="205" fill="#94a3b8" font-family="monospace" font-size="12">design: <tspan fill="#a855f7">"Luxury & Responsive"</tspan>,</text>
  <text x="125" y="230" fill="#94a3b8" font-family="monospace" font-size="12">clientSatisfaction: <tspan fill="#10b981">"100% Guaranteed"</tspan></text>
  <text x="100" y="255" fill="#38bdf8" font-family="monospace" font-size="13">};</text>

  <!-- Interactive Terminal Line -->
  <rect x="100" y="280" width="400" height="90" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="120" y="310" fill="#10b981" font-family="monospace" font-size="12">✓ Deploying to mzcodehub.com ... [SUCCESS]</text>
  <text x="120" y="335" fill="#38bdf8" font-family="monospace" font-size="12">⚡ Lighthouse Performance: 100/100</text>
  <text x="120" y="355" fill="#fbbf24" font-family="monospace" font-size="12">🚀 Ready to attract high-paying clients.</text>

  <!-- Floating Badge 1 (Speed) -->
  <g transform="translate(40, 290)">
    <rect width="140" height="50" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="30" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="18">⚡ 100%</text>
    <text x="80" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">سرعة</text>
    <text x="80" y="38" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">فائقة</text>
  </g>

  <!-- Floating Badge 2 (Sales) -->
  <g transform="translate(420, 100)">
    <rect width="150" height="55" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="15" y="34" fill="#3b82f6" font-family="sans-serif" font-weight="bold" font-size="20">+$420K</text>
    <text x="92" y="26" fill="#94a3b8" font-family="sans-serif" font-size="10">مبيعات</text>
    <text x="92" y="41" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">العملاء</text>
  </g>
</svg>
