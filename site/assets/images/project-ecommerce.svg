<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Browser Frame -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Browser Dots -->
  <circle cx="60" cy="55" r="6" fill="#ef4444"/>
  <circle cx="80" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="55" r="6" fill="#10b981"/>
  
  <!-- Address Bar -->
  <rect x="130" y="44" width="450" height="22" rx="6" fill="#0f172a"/>
  <text x="145" y="59" fill="#94a3b8" font-family="sans-serif" font-size="11">https://urban-trend.store/checkout • Fast 0.6s</text>

  <!-- Header Nav inside mockup -->
  <rect x="50" y="85" width="700" height="40" rx="6" fill="#0f172a"/>
  <rect x="70" y="97" width="90" height="16" rx="4" fill="url(#primary)"/>
  <rect x="540" y="97" width="50" height="16" rx="4" fill="#334155"/>
  <rect x="600" y="97" width="60" height="16" rx="4" fill="#334155"/>
  <rect x="670" y="93" width="65" height="24" rx="6" fill="url(#accent)"/>

  <!-- Hero Banner inside mockup -->
  <rect x="50" y="140" width="430" height="190" rx="10" fill="#0f172a" stroke="#334155"/>
  <rect x="75" y="165" width="180" height="22" rx="5" fill="#f8fafc"/>
  <rect x="75" y="197" width="280" height="14" rx="4" fill="#64748b"/>
  <rect x="75" y="218" width="220" height="14" rx="4" fill="#64748b"/>
  
  <!-- CTA Button inside mockup -->
  <rect x="75" y="255" width="130" height="36" rx="8" fill="url(#primary)"/>
  <text x="100" y="278" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">تسوق الآن</text>
  
  <!-- Product Cards inside mockup -->
  <rect x="500" y="140" width="250" height="190" rx="10" fill="#0f172a" stroke="#334155"/>
  <rect x="520" y="155" width="210" height="95" rx="8" fill="#1e293b"/>
  <circle cx="625" cy="202" r="28" fill="#3b82f6" opacity="0.4"/>
  <rect x="520" y="260" width="120" height="14" rx="4" fill="#f8fafc"/>
  <rect x="520" y="280" width="60" height="16" rx="4" fill="#10b981"/>
  <rect x="650" y="275" width="80" height="28" rx="6" fill="url(#primary)"/>

  <!-- Metrics Bar Bottom -->
  <rect x="50" y="350" width="700" height="95" rx="10" fill="#0f172a" stroke="#334155"/>
  
  <!-- Metric 1 -->
  <rect x="70" y="365" width="200" height="65" rx="8" fill="#1e293b"/>
  <text x="85" y="390" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="20">+180%</text>
  <text x="85" y="415" fill="#94a3b8" font-family="sans-serif" font-size="12">زيادة معدل الشراء</text>

  <!-- Metric 2 -->
  <rect x="300" y="365" width="200" height="65" rx="8" fill="#1e293b"/>
  <text x="315" y="390" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="20">0.6s</text>
  <text x="315" y="415" fill="#94a3b8" font-family="sans-serif" font-size="12">سرعة تحميل الصفحات</text>

  <!-- Metric 3 -->
  <rect x="530" y="365" width="200" height="65" rx="8" fill="#1e293b"/>
  <text x="545" y="390" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="20">+$420K</text>
  <text x="545" y="415" fill="#94a3b8" font-family="sans-serif" font-size="12">مبيعات الربع الأول</text>
</svg>
