<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="med-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#med-bg)"/>
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#134e4a" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1.5"/>

  <circle cx="60" cy="55" r="6" fill="#ef4444"/>
  <circle cx="80" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="55" r="6" fill="#10b981"/>
  <rect x="130" y="44" width="450" height="22" rx="6" fill="#0f172a"/>
  <text x="145" y="59" fill="#5eead4" font-family="sans-serif" font-size="11">https://health-sync.care/booking • Auto WhatsApp Sync</text>

  <!-- Calendar View -->
  <rect x="50" y="85" width="420" height="360" rx="10" fill="#0f172a" stroke="#134e4a"/>
  <text x="75" y="120" fill="#2dd4bf" font-family="sans-serif" font-weight="bold" font-size="15">جدول المواعيد المتاحة</text>
  
  <!-- Calendar Grid Mockup -->
  <g fill="#1e293b">
    <rect x="75" y="140" width="45" height="40" rx="4"/>
    <rect x="130" y="140" width="45" height="40" rx="4"/>
    <rect x="185" y="140" width="45" height="40" rx="4" fill="#0d9488"/>
    <rect x="240" y="140" width="45" height="40" rx="4"/>
    <rect x="295" y="140" width="45" height="40" rx="4"/>
    <rect x="350" y="140" width="45" height="40" rx="4"/>

    <rect x="75" y="190" width="45" height="40" rx="4"/>
    <rect x="130" y="190" width="45" height="40" rx="4"/>
    <rect x="185" y="190" width="45" height="40" rx="4"/>
    <rect x="240" y="190" width="45" height="40" rx="4" fill="#0d9488"/>
    <rect x="295" y="190" width="45" height="40" rx="4"/>
    <rect x="350" y="190" width="45" height="40" rx="4"/>
  </g>

  <!-- Slots -->
  <text x="75" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12">الأوقات المتاحة اليوم:</text>
  <rect x="75" y="275" width="80" height="30" rx="6" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="90" y="295" fill="#5eead4" font-family="sans-serif" font-size="11">04:30 م</text>

  <rect x="165" y="275" width="80" height="30" rx="6" fill="#1e293b"/>
  <text x="180" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">05:15 م</text>

  <rect x="255" y="275" width="80" height="30" rx="6" fill="#1e293b"/>
  <text x="270" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">06:00 م</text>

  <!-- WhatsApp Notification Mockup -->
  <rect x="490" y="85" width="260" height="360" rx="10" fill="#0f172a" stroke="#10b981"/>
  <rect x="510" y="105" width="220" height="35" rx="6" fill="#065f46"/>
  <text x="525" y="127" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">إشعار واتساب التلقائي ✓</text>
  
  <rect x="510" y="155" width="220" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="525" y="180" fill="#34d399" font-family="sans-serif" font-size="11">تم تأكيد حجزك بنجاح!</text>
  <text x="525" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="11">الموعد: الأحد 04:30 م</text>
  <text x="525" y="225" fill="#e2e8f0" font-family="sans-serif" font-size="11">العيادة: د. مريم الشمري</text>
  <rect x="525" y="245" width="190" height="28" rx="4" fill="#059669"/>
  <text x="545" y="264" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">تأكيد الحضور بنقرة واحدة</text>

  <!-- Metric -->
  <rect x="510" y="325" width="220" height="95" rx="8" fill="#042f2e" stroke="#0d9488"/>
  <text x="530" y="360" fill="#2dd4bf" font-family="sans-serif" font-weight="bold" font-size="24">-85%</text>
  <text x="530" y="390" fill="#ccfbf1" font-family="sans-serif" font-size="12">انخفاض في نسبة تخلف المرضى</text>
</svg>
