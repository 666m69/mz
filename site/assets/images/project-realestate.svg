  <rect x="295" y="370" width="205" height="60" rx="8" fill="#092a27"/>
  <text x="310" y="395" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="20">+210%</text>
  <text x="310" y="418" fill="#94a3b8" font-family="sans-serif" font-size="11">زيادة استفسارات المشترين VIP</text>

  <rect x="520" y="370" width="210" height="60" rx="8" fill="#092a27"/>
