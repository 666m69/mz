<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e19">
<meta name="robots" content="noindex,nofollow">
<title>MZcode | نطوّر لك تجربة أفضل</title>
<meta name="description" content="MZcode — خلّ التقنية علينا. نعمل على تطوير المنصة وتجهيز تجربة أفضل، ونعود قريبًا.">
<link rel="icon" href="/assets/images/mz-mark.svg">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:#080e19;color:#f3f6ff;display:grid;place-items:center;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:-25%;pointer-events:none;background:radial-gradient(ellipse 32% 29% at 54% 37%,#1c746b34,transparent 75%),radial-gradient(ellipse 30% 25% at 17% 74%,#2255a52d,transparent 80%);z-index:0}
.shell{position:relative;z-index:1;max-width:680px;width:100%;padding:72px 22px 55px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr}
.brand img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 0 30px #21d6b24b)}
.brand-name{font-size:clamp(36px,7vw,56px);font-weight:850;letter-spacing:-2px;line-height:1;color:#fff}
.brand-name span{color:#51e1c3}
.tagline{color:#9eafc3;font-size:17px;margin:12px 0 55px}
.status{display:inline-flex;align-items:center;gap:9px;border:1px solid #32665e;background:#102e2b;padding:9px 17px;border-radius:999px;font-size:13px;color:#b2f5df}
.dot{height:8px;width:8px;border-radius:50%;background:#56e2b7;box-shadow:0 0 0 5px #56e2b71c}
h1{font-size:clamp(30px,6.2vw,52px);line-height:1.3;letter-spacing:-1.1px;margin:27px 0 15px;font-weight:800}
h1 em{font-style:normal;color:#66e5c4}
.desc{font-size:clamp(16px,3.8vw,19px);line-height:2;color:#b0bed0;margin:0 auto 30px;max-width:520px}
.line{width:65px;height:3px;background:linear-gradient(90deg,#2d75d5,#60e1bc);border-radius:9px;margin:35px auto}
.footer{font-size:14px;color:#8495ad;line-height:2}
.footer a{color:#8fe7d1;text-decoration:none;border-bottom:1px solid #32665e}
.footer a:focus-visible{outline:2px solid #8fe7d1;outline-offset:5px}
@media(max-width:420px){.shell{padding:52px 20px}.brand img{width:72px;height:72px}.tagline{margin-bottom:45px}.desc{line-height:1.85}}
</style>
</head>
<body>
<main class="shell">
<div class="brand" aria-label="MZcode"><img src="/assets/images/mz-mark-gold.svg" alt="شعار MZ" width="88" height="88"><div class="brand-name">MZ<span>code</span></div></div>
<p class="tagline">خلّ التقنية علينا.</p>
<div class="status"><span class="dot" aria-hidden="true"></span>تطوير وتحديث المنصة</div>
<h1>نطوّر لك <em>تجربة أفضل.</em></h1>
<p class="desc">نعمل حاليًا على تجهيز تجربة MZcode القادمة، بأدوات وخدمات رقمية أكثر فاعلية.<br>شكرًا لزيارتك وثقتك، نلتقي قريبًا.</p>
<div class="line" aria-hidden="true"></div>
<p class="footer">للاستفسارات: <a href="mailto:info@mzcodehub.com">info@mzcodehub.com</a><br>MZcode — من الفكرة إلى التنفيذ.</p>
</main>
</body>
</html>
