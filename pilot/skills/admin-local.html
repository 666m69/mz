<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MZcode Skills — Local Admin</title><style>body{font:16px system-ui;background:#0a1220;color:#eff7ff;margin:0}main{max-width:900px;margin:auto;padding:28px}h1{color:#69e0bd}section{background:#14243a;border:1px solid #304c65;padding:20px;border-radius:18px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #54718d}input{background:#091725;color:white;max-width:100%}button{background:#65ddb7;color:#092025;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #36516a;text-align:right}@media(max-width:560px){main{padding:14px}table{font-size:12px}}</style></head><body><main><h1>MZcode — إدارة المهارات</h1><p>واجهة داخلية تجريبية، غير متصلة بالإنتاج. لا تضع رمز الإدارة في موقع عام.</p><section><label>عنوان API المحلي <input id="base" value="http://127.0.0.1:8789"></label><p><label>رمز المالك <input id="token" type="password" autocomplete="off"></label></p><button id="load">قراءة المهارات</button><p id="status" role="status"></p></section><section><h2>سجل المهارات</h2><div style="overflow-x:auto"><table><thead><tr><th>المهارة</th><th>الإصدار</th><th>الاختبار</th><th>الحالة</th><th>الإدارة</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>سجل التشغيل</h2><button id="audit">عرض السجل</button><pre id="logs"></pre></section><script>const $=id=>document.getElementById(id);async function call(path,method='GET',body){const res=await fetch($('base').value.replace(/\/$/,'')+path,{method,headers:{'authorization':'Bearer '+$('token').value,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.error||res.status);return data.result}async function load(){try{$('status').textContent='جاري القراءة';const data=await call('/internal/skills');$('rows').replaceChildren();for(const d of data){const tr=document.createElement('tr');for(const value of [d.name_ar,d.version,d.test_status,d.enabled?'مفعلة':'معطلة']){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');const button=document.createElement('button');button.textContent=d.enabled?'تعطيل':'تفعيل';button.addEventListener('click',async()=>{try{await call('/internal/skills/'+encodeURIComponent(d.id)+'/enabled','PATCH',{enabled:!d.enabled});await load()}catch(e){$('status').textContent=e.message}});actions.append(button);tr.append(actions);$('rows').append(tr)}$('status').textContent='تمت القراءة'}catch(e){$('status').textContent='خطأ: '+e.message}}$('load').onclick=load;$('audit').onclick=async()=>{try{$('logs').textContent=JSON.stringify(await call('/internal/skills/audit'),null,2)}catch(e){$('logs').textContent=e.message}}</script></main></body></html>
